<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>콘텐츠 스케줄 🐰</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fff9fb;--card:#ffffff;--border:#f0e4ec;--text:#3a2a35;--muted:#9a8090;--hint:#c8b0be;
    --c1:#fde8f0;--c1t:#c45878;--c1b:#f4b8ce;
    --c2:#f5e8fd;--c2t:#9050c0;--c2b:#d8a8f4;
    --c3:#e8eafd;--c3t:#4858c8;--c3b:#a8b0f4;
    --c4:#e8f5fd;--c4t:#2878b8;--c4b:#90c8f0;
    --c5:#e8fdf0;--c5t:#28906a;--c5b:#90dab8;
    --c6:#fdf5e8;--c6t:#b07828;--c6b:#f0cca0;
    --r:16px;--shadow:0 2px 16px rgba(180,120,150,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito','Gowun Dodum',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,#e8c8d860 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0}
  .app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:28px 24px 60px}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap}
.header-left{display:flex;align-items:center;gap:14px}
.mascot-ring{width:54px;height:54px;border-radius:50%;background:var(–c1);border:2px dashed var(–c1b);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;flex-shrink:0;transition:border-color 0.2s,transform 0.15s}
.mascot-ring:hover{border-color:var(–c1t);transform:scale(1.05)}
.mascot-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.app-title{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(–c1t),var(–c2t));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}
.app-sub{font-size:12px;color:var(–muted)}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{padding:7px 18px;border-radius:20px;border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s}
.btn-ghost{background:var(–card);border:1px solid var(–border);color:var(–muted)}
.btn-ghost:hover{background:var(–c1);color:var(–c1t);border-color:var(–c1b)}
.btn-primary{background:linear-gradient(135deg,var(–c1t),var(–c2t));color:white}
.btn-primary:hover{opacity:0.88;transform:translateY(-1px)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.toast{font-size:12px;font-weight:600;opacity:0;transition:opacity 0.3s;padding:5px 12px;border-radius:20px}
.toast-ok{color:var(–c5t);background:var(–c5);border:1px solid var(–c5b)}
.toast-err{color:#c04040;background:#fde8e8;border:1px solid #f4b0b0}
.sync-status{font-size:11px;color:var(–muted);display:flex;align-items:center;gap:5px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(–c5t);flex-shrink:0}
.sync-dot.syncing{background:var(–c6t);animation:pulse 1s infinite}
.sync-dot.error{background:#c04040}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* 월 탭 */
.month-tabs-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.month-tab{padding:6px 20px;border-radius:20px;border:1px solid var(–border);background:var(–card);font-family:inherit;font-size:13px;font-weight:700;color:var(–muted);cursor:pointer;transition:all 0.15s}
.month-tab:hover{background:var(–c2);color:var(–c2t);border-color:var(–c2b)}
.month-tab.active{background:linear-gradient(135deg,var(–c2t),var(–c1t));color:white;border-color:transparent}

/* 주차 탭 */
.week-tabs-row{display:flex;align-items:center;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.week-tab{padding:5px 14px;border-radius:20px;border:1px solid var(–border);background:var(–card);font-family:inherit;font-size:12px;font-weight:600;color:var(–muted);cursor:pointer;transition:all 0.15s}
.week-tab:hover{background:var(–c1);color:var(–c1t);border-color:var(–c1b)}
.week-tab.active{background:linear-gradient(135deg,var(–c1t),var(–c2t));color:white;border-color:transparent}
.week-tab-add{font-size:12px;padding:5px 12px;border-radius:20px;border:1.5px dashed var(–border);background:transparent;font-family:inherit;color:var(–hint);cursor:pointer;transition:all 0.15s}
.week-tab-add:hover{border-color:var(–c1t);color:var(–c1t);background:var(–c1)}

.progress-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.progress-label{font-size:12px;color:var(–muted);white-space:nowrap}
.progress-track{flex:1;height:7px;background:var(–border);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(–c1t),var(–c2t),var(–c3t));transition:width 0.4s cubic-bezier(.4,0,.2,1)}
.progress-count{font-size:12px;color:var(–muted);white-space:nowrap}

.weekly-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.day-col{border-radius:var(–r);border:1.5px solid transparent;overflow:hidden;background:var(–card);box-shadow:var(–shadow);transition:transform 0.15s,box-shadow 0.15s}
.day-col:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(180,120,150,0.13)}
.day-col:nth-child(1){border-color:var(–c1b)}.day-col:nth-child(2){border-color:var(–c2b)}
.day-col:nth-child(3){border-color:var(–c3b)}.day-col:nth-child(4){border-color:var(–c4b)}
.day-col:nth-child(5){border-color:var(–c5b)}.day-col:nth-child(6){border-color:var(–c6b)}
.day-header{padding:10px 10px 8px;text-align:center}
.day-col:nth-child(1) .day-header{background:var(–c1)}.day-col:nth-child(2) .day-header{background:var(–c2)}
.day-col:nth-child(3) .day-header{background:var(–c3)}.day-col:nth-child(4) .day-header{background:var(–c4)}
.day-col:nth-child(5) .day-header{background:var(–c5)}.day-col:nth-child(6) .day-header{background:var(–c6)}
.day-name{font-size:14px;font-weight:700}
.day-date{font-size:11px;margin-top:1px;opacity:0.7}
.day-col:nth-child(1) .day-name,.day-col:nth-child(1) .day-date{color:var(–c1t)}
.day-col:nth-child(2) .day-name,.day-col:nth-child(2) .day-date{color:var(–c2t)}
.day-col:nth-child(3) .day-name,.day-col:nth-child(3) .day-date{color:var(–c3t)}
.day-col:nth-child(4) .day-name,.day-col:nth-child(4) .day-date{color:var(–c4t)}
.day-col:nth-child(5) .day-name,.day-col:nth-child(5) .day-date{color:var(–c5t)}
.day-col:nth-child(6) .day-name,.day-col:nth-child(6) .day-date{color:var(–c6t)}
.day-body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px;min-height:220px}
.day-body.done-state{opacity:0.5}
.field-label{font-size:10px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;color:var(–hint);margin-bottom:3px}
.title-input{width:100%;font-family:inherit;font-size:13px;border:none;border-bottom:1.5px solid var(–border);background:transparent;color:var(–text);padding:2px 0;outline:none;transition:border-color 0.15s;font-weight:600}
.title-input::placeholder{color:var(–hint);font-weight:400}
.title-input:focus{border-bottom-color:var(–c1t)}
.channel-input{width:100%;font-family:inherit;font-size:12px;border:none;border-bottom:1.5px solid var(–border);background:transparent;color:var(–c2t);padding:2px 0;outline:none;transition:border-color 0.15s;font-weight:600}
.channel-input::placeholder{color:var(–hint);font-weight:400}
.channel-input:focus{border-bottom-color:var(–c2t)}
.plat-btn{display:inline-block;font-family:inherit;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;border:none;cursor:pointer;transition:all 0.15s}
.memo-input{width:100%;font-family:inherit;font-size:12px;border:1.5px solid var(–border);border-radius:10px;background:var(–bg);color:var(–text);padding:6px 8px;outline:none;resize:none;line-height:1.55;transition:border-color 0.15s}
.memo-input::placeholder{color:var(–hint)}
.memo-input:focus{border-color:var(–c2b)}
.check-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.check-label{font-size:10px;color:var(–hint);font-weight:600}
.check-circle{width:22px;height:22px;border-radius:50%;border:2px solid var(–border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all 0.2s;flex-shrink:0}
.check-circle:hover{border-color:var(–c5t)}
.check-circle.done{background:var(–c5t);border-color:var(–c5t);color:white}

.loading-screen{position:fixed;inset:0;background:var(–bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100}
.loading-spinner{width:36px;height:36px;border:3px solid var(–border);border-top-color:var(–c1t);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(–muted);font-weight:600}

@media(max-width:900px){.weekly-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:540px){.weekly-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app{padding:16px 12px 40px}}
.day-col{animation:fadeUp 0.3s ease both}
.day-col:nth-child(1){animation-delay:0.03s}.day-col:nth-child(2){animation-delay:0.06s}
.day-col:nth-child(3){animation-delay:0.09s}.day-col:nth-child(4){animation-delay:0.12s}
.day-col:nth-child(5){animation-delay:0.15s}.day-col:nth-child(6){animation-delay:0.18s}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>

</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div style="font-size:36px">🐰</div>
  <div class="loading-spinner"></div>
  <div class="loading-text">스케줄 불러오는 중...</div>
</div>

<div class="app" style="display:none" id="mainApp">
  <div class="header">
    <div class="header-left">
      <div class="mascot-ring" id="mascotRing" onclick="document.getElementById('mascotFile').click()">
        <img id="mascotImg" src="" style="display:none">
        <span id="mascotPh" style="font-size:22px">🐰</span>
      </div>
      <div>
        <div class="app-title">content schedule</div>
        <div class="app-sub" id="weekRangeLabel">날짜 로딩 중...</div>
      </div>
    </div>
    <div class="header-right">
      <div class="sync-status">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">동기화됨</span>
      </div>
      <span class="toast toast-ok" id="saveToast">저장됨!</span>
      <span class="toast toast-err" id="errToast">저장 실패 😢</span>
      <button class="btn btn-primary" id="saveBtn" onclick="saveData()">저장 💾</button>
    </div>
  </div>

  <!-- 월 탭 -->

  <div class="month-tabs-row" id="monthTabsRow"></div>

  <!-- 주차 탭 -->

  <div class="week-tabs-row" id="weekTabsRow"></div>

  <div class="progress-row">
    <span class="progress-label" id="progressLabel">이번 주</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <span class="progress-count" id="progressCount">0/6</span>
  </div>

  <div class="weekly-grid" id="weeklyGrid"></div>
</div>

<input type="file" id="mascotFile" accept="image/*" style="display:none" onchange="loadMascot(event)">

<script>
const SB_URL='https://rveaefcqcpsgnvwuaivo.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2ZWFlZmNxY3BzZ252d3VhaXZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMDQzNzUsImV4cCI6MjA5MTg4MDM3NX0.dOrFFUu7bMCspsSPJH-KyYAQkD9D16j1LX3MFuaKvKY';

// ✅ 플랫폼 4개로 변경
const PLATFORMS=['Insta','Reels','Shorts','Blog'];
const DAYS_KR=['월','화','수','목','금','토'];
const PS={
  'Insta':{bg:'#f5e8fd',color:'#9050c0'},
  'Reels':{bg:'#fde8e8',color:'#c04040'},
  'Shorts':{bg:'#e8f5fd',color:'#3080b0'},
  'Blog':{bg:'#e8fdf0',color:'#2a9060'}
};

// ✅ 데이터 구조: months 배열 안에 weeks 배열
// months = [ { year, month, weeks: [ { weekNum, monday, posts: [...] } ] } ]
let months=[], curMonth=0, curWeek=0, saveTimer=null;

function getMon(d){
  const dt=new Date(d),day=dt.getDay();
  dt.setDate(dt.getDate()-day+(day===0?-6:1));
  return dt.toISOString().slice(0,10);
}
function fmt(s){const d=new Date(s);return `${d.getMonth()+1}/${d.getDate()}`}
function monthLabel(year,month){return `${year}년 ${month}월`}

function mkPost(date,day){
  return {date,day,channel:'',title:'',platform:'Insta',done:false,memo:''};
}
function mkWeek(weekNum, mon){
  const m=new Date(mon);
  return {
    weekNum, monday:mon,
    posts: DAYS_KR.map((day,i)=>{
      const d=new Date(m); d.setDate(m.getDate()+i);
      return mkPost(d.toISOString().slice(0,10), day);
    })
  };
}
function mkMonth(year, month){
  // 해당 월의 첫 번째 월요일 찾기
  const firstDay=new Date(year,month-1,1);
  const firstMon=getMon(firstDay);
  const weeks=[];
  let mon=new Date(firstMon);
  let wn=1;
  // 해당 월에 속하는 주차만 (월요일 기준, 월~토가 해당 월이거나 걸치는 경우 포함)
  while(true){
    // 이 주의 월~토 중 하나라도 해당 month에 속하면 포함
    const sat=new Date(mon); sat.setDate(mon.getDate()+5);
    if(mon.getMonth()+1 > month && mon.getFullYear() >= year) break;
    if(sat.getMonth()+1 < month && sat.getFullYear() <= year){mon.setDate(mon.getDate()+7);continue;}
    // 해당 월 벗어나면 중단
    const monMonth=mon.getMonth()+1;
    const monYear=mon.getFullYear();
    if((monYear===year && monMonth>month)||(monYear>year)) break;
    weeks.push(mkWeek(wn, mon.toISOString().slice(0,10)));
    wn++;
    mon.setDate(mon.getDate()+7);
    if(weeks.length>=5) break; // 최대 5주
  }
  return {year, month, weeks};
}

function todayMonthObj(){
  const d=new Date();
  return {year:d.getFullYear(), month:d.getMonth()+1};
}

async function sbFetch(method,body){
  const r=await fetch(`${SB_URL}/rest/v1/schedule?id=eq.main`,{
    method,
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':method==='PATCH'?'return=minimal':'return=representation'},
    body:body?JSON.stringify(body):undefined
  });
  if(!r.ok)throw new Error('HTTP '+r.status);
  return method==='PATCH'?null:r.json();
}

async function loadData(){
  setSyncState('syncing','불러오는 중...');
  try{
    const rows=await sbFetch('GET');
    if(rows&&rows.length>0&&rows[0].data&&rows[0].data.months){
      months=rows[0].data.months;
    } else {
      const t=todayMonthObj();
      months=[mkMonth(t.year,t.month)];
    }
    setSyncState('ok','동기화됨');
  }catch(e){
    const t=todayMonthObj();
    months=[mkMonth(t.year,t.month)];
    setSyncState('error','오프라인 모드');
  }
  const ms=localStorage.getItem('jj_mascot');
  if(ms)setMascot(ms);
  curMonth=0; curWeek=0;
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
  render();
}

async function saveData(){
  const btn=document.getElementById('saveBtn');
  btn.disabled=true;
  setSyncState('syncing','저장 중...');
  try{
    await sbFetch('PATCH',{data:{months},updated_at:new Date().toISOString()});
    setSyncState('ok','동기화됨');
    toast('saveToast');
  }catch(e){
    setSyncState('error','저장 실패');
    toast('errToast');
  }
  btn.disabled=false;
}

function autoSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveData,1800)}

function setSyncState(state,label){
  document.getElementById('syncDot').className='sync-dot'+(state==='syncing'?' syncing':state==='error'?' error':'');
  document.getElementById('syncLabel').textContent=label;
}
function toast(id){const e=document.getElementById(id);e.style.opacity='1';setTimeout(()=>e.style.opacity='0',2200)}

// ✅ 월 추가
function addMonth(){
  const last=months[months.length-1];
  let y=last.year, m=last.month+1;
  if(m>12){m=1;y++;}
  months.push(mkMonth(y,m));
  curMonth=months.length-1; curWeek=0;
  render(); saveData();
}

// ✅ 주차 추가 (현재 월에)
function addWeekToMonth(){
  const mo=months[curMonth];
  const lastWeek=mo.weeks[mo.weeks.length-1];
  const lastMon=new Date(lastWeek.monday);
  lastMon.setDate(lastMon.getDate()+7);
  const newWeekNum=mo.weeks.length+1;
  mo.weeks.push(mkWeek(newWeekNum, lastMon.toISOString().slice(0,10)));
  curWeek=mo.weeks.length-1;
  render(); saveData();
}

function loadMascot(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{localStorage.setItem('jj_mascot',ev.target.result);setMascot(ev.target.result)};
  r.readAsDataURL(f);
}
function setMascot(src){
  const img=document.getElementById('mascotImg');
  img.src=src;img.style.display='block';
  document.getElementById('mascotPh').style.display='none';
}

function render(){renderMonthTabs();renderWeekTabs();renderGrid();renderProgress()}

function renderMonthTabs(){
  const row=document.getElementById('monthTabsRow');
  row.innerHTML=months.map((mo,i)=>`
    <button class="month-tab${i===curMonth?' active':''}" onclick="switchMonth(${i})">${monthLabel(mo.year,mo.month)}</button>
  `).join('')+`<button class="week-tab-add" onclick="addMonth()">+ 월 추가</button>`;
}

function renderWeekTabs(){
  const mo=months[curMonth];
  const row=document.getElementById('weekTabsRow');
  row.innerHTML=mo.weeks.map((w,i)=>`
    <button class="week-tab${i===curWeek?' active':''}" onclick="switchWeek(${i})">${w.weekNum}주차</button>
  `).join('')+`<button class="week-tab-add" onclick="addWeekToMonth()">+ 주 추가</button>`;

  // 날짜 범위 업데이트
  const w=mo.weeks[curWeek];
  const fri=new Date(w.monday); fri.setDate(fri.getDate()+5);
  document.getElementById('weekRangeLabel').textContent=
    `${monthLabel(mo.year,mo.month)} · ${w.weekNum}주차 (${fmt(w.monday)} ~ ${fmt(fri.toISOString().slice(0,10))})`;
}

function switchMonth(i){curMonth=i;curWeek=0;render()}
function switchWeek(i){curWeek=i;render()}

function renderGrid(){
  const g=document.getElementById('weeklyGrid');g.innerHTML='';
  const posts=months[curMonth].weeks[curWeek].posts;
  posts.forEach((p,pi)=>{
    const s=PS[p.platform]||PS['Insta'];
    const col=document.createElement('div');col.className='day-col';
    col.innerHTML=`
      <div class="day-header">
        <div class="day-name">${p.day}요일</div>
        <div class="day-date">${fmt(p.date)}</div>
      </div>
      <div class="day-body${p.done?' done-state':''}">
        <div>
          <div class="field-label">채널</div>
          <input class="channel-input" placeholder="채널 이름..." value="${esc(p.channel||'')}"
            oninput="months[curMonth].weeks[curWeek].posts[${pi}].channel=this.value;autoSave()"
            onblur="saveData()"/>
        </div>
        <div>
          <div class="field-label">제목</div>
          <input class="title-input" placeholder="에피소드 제목..." value="${esc(p.title)}"
            oninput="months[curMonth].weeks[curWeek].posts[${pi}].title=this.value;autoSave()"
            onblur="saveData()"/>
        </div>
        <div>
          <button class="plat-btn" style="background:${s.bg};color:${s.color}" onclick="cyclePlat(${pi})">${p.platform}</button>
        </div>
        <div>
          <div class="field-label">메모</div>
          <textarea class="memo-input" rows="3" placeholder="아이디어, 링크, 메모..."

function renderProgress(){
const posts=months[curMonth].weeks[curWeek].posts;
const done=posts.filter(p=>p.done).length, pct=Math.round(done/6*100);
document.getElementById(‘progressFill’).style.width=pct+’%’;
document.getElementById(‘progressLabel’).textContent=`이번 주 ${pct}% 완료`;
document.getElementById(‘progressCount’).textContent=`${done}/6`;
}

function cyclePlat(pi){
const c=months[curMonth].weeks[curWeek].posts[pi].platform;
months[curMonth].weeks[curWeek].posts[pi].platform=PLATFORMS[(PLATFORMS.indexOf(c)+1)%PLATFORMS.length];
renderGrid();autoSave();
}
function toggleDone(pi){
months[curMonth].weeks[curWeek].posts[pi].done=!months[curMonth].weeks[curWeek].posts[pi].done;
renderGrid();renderProgress();saveData();
}
function autoH(el){el.style.height=‘auto’;el.style.height=el.scrollHeight+‘px’}
function esc(s){return String(s).replace(/&/g,’&’).replace(/</g,’<’).replace(/>/g,’>’).replace(/”/g,’"’)}
